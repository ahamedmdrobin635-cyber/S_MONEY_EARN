<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f0d" />
  <title>S MONEY EARN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">S MONEY <span>EARN</span></div>
        <div class="status" id="status">Connecting to Telegram…</div>
      </div>
    </header>

    <section class="card profile-card">
      <div class="avatar" id="avatar">S</div>
      <div>
        <h2 id="name">Loading…</h2>
        <p id="username">Please wait</p>
      </div>
    </section>

    <section class="card balance-card">
      <p>Total Balance</p>
      <h1><span id="balance">0.00</span> <small>SMC</small></h1>
      <div class="stats">
        <div><span>Total Earned</span><b id="totalEarned">0.00</b></div>
        <div><span>Mining Rate</span><b id="miningRate">0.00</b></div>
        <div><span>Referral Bonus</span><b id="referralBonus">0.00</b></div>
      </div>
    </section>

    <section id="message" class="message">Opening your Telegram account…</section>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
